<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Fantasy Maps | Submit your map</title>
        <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
        <script type="module">
            // Import the functions you need from the SDKs you need
            import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
            // TODO: Add SDKs for Firebase products that you want to use
            // https://firebase.google.com/docs/web/setup#available-libraries
          
            // Your web app's Firebase configuration
            const firebaseConfig = {
              apiKey: "AIzaSyAiYPxjIodIRgWpSg1nFVsBJ87k-smTGic",
              authDomain: "fantasymaps-334622.firebaseapp.com",
              projectId: "fantasymaps-334622",
              storageBucket: "fantasymaps-334622.appspot.com",
              messagingSenderId: "733537716875",
              appId: "1:733537716875:web:d32431683c8253c41ae28e"
            };
          
            // Initialize Firebase
            firebase.initializeApp(firebaseConfig)
        </script>
        <script src="https://www.gstatic.com/firebasejs/ui/6.0.0/firebase-ui-auth.js"></script>
        <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.0.0/firebase-ui-auth.css" />

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css">
        <link rel="stylesheet" href="/styles/submit-map.css">
    </head>
    <body>
        <section class="container section is-small">
            <h1 class="title">Submit your map</h1>
        </section>
        <section class="container section is-medium">
            <form enctype="multipart/form-data" id="map-submission" method="post">
                <!--<div class="field">
                    <label class="label">Grid size</label>
                    <div class="control">
                    <input class="input" type="text" placeholder="e.g. 30x40">
                    </div>
                </div>-->
 
                <div class="file is-large is-boxed">
                    <label class="file-label">
                      <input id="file-upload"
                            name="file-upload"
                            required
                            class="file-input"
                            type="file"
                            accept=".jpg, .gif, .png">
                      <span class="file-cta">
                        <span class="file-icon">
                          <i class="fas fa-upload"></i>
                        </span>
                        <span id="lbl-file-upload" class="file-label">
                          Choose a JPG, GIF, or PNG
                        </span>
                      </span>
                    </label>
                </div>

                <div class="field">
                    <div class="control is-hidden">
                        <input id="file-name"
                                name="file-name"
                                required
                                type="text"/>
                    </div>
                </div>
                <div class="field">
                    <div class="control">
                    <label class="checkbox">
                        <input type="checkbox"
                            required
                            id="chx-tos">
                        I agree to the <a href="/terms-of-service" target="_blank">terms and conditions</a>
                    </label>
                    </div>
                </div>
              
              
                <div class="field is-grouped">
                    <div class="control">
                    <button id="btn-submit" disabled class="button is-link">Submit</button>
                    </div>
                </div>
            </form>
        </section>
        <script defer src="/scripts/submit-map.js"></script>
    </body>
</html>
